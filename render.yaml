services:
  - type: web
    name: nobeth-document-intelligence
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: GEMINI_PRIMARY_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.1-flash-lite
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: MAX_PDF_PAGES
        value: "50"
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: JOB_RETENTION_HOURS
        value: "24"
      - key: OPEN_BROWSER
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
